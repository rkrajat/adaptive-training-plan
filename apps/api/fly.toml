# fly.toml app configuration file generated for adaptive-training-plan-api
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "adaptive-training-plan-api"
primary_region = "lhr"

[build]
  dockerfile = "../../Dockerfile.api"
  build-target = "runner"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
  protocol = "http"
  tls_skip_verify = false

  [http_service.checks.headers]
    Content-Type = "application/json"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
